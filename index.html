<html lang="en">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link id="app-favicon" rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (() => {
        const adminHostnames = [
          'admin.joeyoke.com',
          'joeyokeadmin.joeyoke.com',
        ]

        if (adminHostnames.includes(window.location.hostname.toLowerCase())) {
          const favicon = document.getElementById('app-favicon')
          favicon.type = 'image/jpeg'
          favicon.href = '/admin-favicon.jpg'
        }
      })()
    </script>
    <title>Joe Yoke – Multiplayer Games and Gaming Community</title>
    <meta

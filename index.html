<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link id="app-favicon" rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (() => {
        const adminHostnames = [
          'admin.joeyoke.com',
          'joeyokeadmin.joeyoke.com',
        ]

        if (adminHostnames.includes(window.location.hostname.toLowerCase())) {
          const favicon = document.getElementById('app-favicon')
          favicon.type = 'image/jpeg'
          favicon.href = '/admin-favicon.jpg'
        }
      })()
    </script>
    <title>Joe Yoke</title>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
